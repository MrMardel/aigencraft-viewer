<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AigenCraft · Visor 3D</title>
<style>
  :root { color-scheme: dark; }
  html,body { margin:0; height:100%; overflow:hidden; background:#a9c9e8;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  #app { position:fixed; inset:0; }
  .panel { position:fixed; z-index:10; background:rgba(12,22,34,.78);
    border:1px solid rgba(140,190,230,.25); border-radius:12px;
    color:#e8f2fb; box-shadow:0 12px 40px rgba(0,0,0,.25);
    backdrop-filter: blur(10px); }
  #info { top:18px; left:18px; padding:14px 18px; max-width:min(420px,80vw); }
  #info h1 { margin:0 0 4px; font-size:16px; letter-spacing:.08em; font-weight:600; }
  #info .sub { color:#9fc3df; font-size:12px; line-height:1.6; }
  #info .num { color:#ffd98a; }
  #hud { bottom:18px; left:18px; padding:10px 14px; font-size:12px;
    color:#bfd8ee; min-width:230px; }
  #hud b { color:#fff; font-weight:600; }
  #controls { top:18px; right:18px; padding:10px; display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; max-width:360px; }
  button { font:inherit; font-size:11px; color:#dcecfb; background:rgba(70,120,170,.25);
    border:1px solid rgba(150,200,240,.3); border-radius:8px; padding:7px 10px;
    cursor:pointer; transition:.15s; }
  button:hover { background:rgba(100,160,220,.4); }
  button.on { background:#3d8fd1; border-color:#8fd0ff; color:#fff; }
  select { font:inherit; font-size:11px; color:#dcecfb; background:rgba(70,120,170,.25);
    border:1px solid rgba(150,200,240,.3); border-radius:8px; padding:7px 8px;
    cursor:pointer; }
  #loading { position:fixed; inset:0; display:grid; place-items:center; z-index:50;
    background:#0b1622; color:#bfe0ff; font-size:14px; letter-spacing:.1em; }
  #loading.hide { display:none; }
  .hint { color:#8fb6d4; font-size:11px; margin-top:6px; }
  #toast { position:fixed; left:50%; bottom:22px; transform:translateX(-50%);
    z-index:20; background:rgba(12,22,34,.9); color:#fff; padding:8px 14px;
    border-radius:8px; font-size:12px; opacity:0; transition:.3s; pointer-events:none; }
  #toast.show { opacity:1; }
</style>
</head>
<body>
<div id="app"></div>
<div id="loading">CARGANDO MUNDO…</div>
<div id="info" class="panel">
  <h1>AIGENCRAFT · VISOR 3D</h1>
  <div class="sub">
    <span id="worldName">—</span> · seed <span class="num" id="seed">—</span><br>
    Área <span class="num" id="area">—</span> · paso <span class="num" id="paso">—</span> bloques<br>
    <span id="range"></span>
  </div>
</div>
<div id="controls" class="panel">
  <select id="worldSel" title="Reino"></select>
  <button id="btnTextures" class="on">Texturas</button>
  <button id="btnRelief">Relieve</button>
  <button id="btnBlocks">Bloques</button>
  <button id="btnWater" class="on">Agua</button>
  <button id="btnTrees" class="on">Árboles</button>
  <button id="btnWire">Aristas</button>
  <button id="btnTop">Vista superior</button>
  <button id="btnReset">Reiniciar vista</button>
</div>
<div id="hud" class="panel">
  <div>Arrastrá para girar · scroll para acercar</div>
  <div class="hint" id="hover">Pasá el mouse sobre el terreno para ver coordenadas.</div>
</div>
<div id="toast"></div>

<script src="three.min.js"></script>
<script src="OrbitControls.js"></script>
<script src="worlds-data.js"></script>
<script>
(function () {
  'use strict';
  const dados = window.WORLDS || {};
  const chaves = Object.keys(dados);
  const pedido = new URLSearchParams(location.search).get('world');
  const clave = pedido && dados[pedido] ? pedido : chaves[0];
  const W = dados[clave];
  if (!W) { document.getElementById('loading').textContent = 'No se encontró worlds-data.js'; return; }

  function b64ToBuffer(b64) {
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes.buffer;
  }

  const heights = new Uint16Array(b64ToBuffer(W.heights));
  const mats = new Uint8Array(b64ToBuffer(W.mats));
  const surfaceBytes = new Uint8Array(b64ToBuffer(W.colors));
  const N = W.width;
  const step = W.step;
  const baseY = Math.max(0, W.minHeight - 2);
  const maxH = Math.max(1, W.maxHeight);

  document.getElementById('worldName').textContent = W.name;
  document.getElementById('seed').textContent = W.seed;
  document.getElementById('area').textContent = (W.width * W.step) + '×' + (W.height * W.step);
  document.getElementById('paso').textContent = W.step;
  document.title = 'AigenCraft · ' + W.name + ' · Visor 3D';
  document.getElementById('range').textContent =
    'Alturas ' + W.minHeight + '–' + W.maxHeight + ' · mar ' + W.sea;

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xa9c9e8);
  scene.fog = new THREE.Fog(0xa9c9e8, 500, 2400);

  const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 1, 6000);
  const medio = Math.round((W.minHeight + W.maxHeight) / 2);
  const center = new THREE.Vector3(0, medio, 0);
  const area = W.width * W.step;
  camera.position.set(area * 0.75, area * 0.55, area * 0.75);

  const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.outputEncoding = THREE.sRGBEncoding;
  document.getElementById('app').appendChild(renderer.domElement);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.075;
  controls.target.copy(center);
  controls.minDistance = 40;
  controls.maxDistance = 2600;
  controls.maxPolarAngle = Math.PI * 0.495;

  scene.add(new THREE.HemisphereLight(0xdceeff, 0x304050, 0.85));
  const sun = new THREE.DirectionalLight(0xfff4e6, 1.15);
  sun.position.set(-1.2, 1.8, 0.9);
  scene.add(sun);
  const fill = new THREE.DirectionalLight(0x9dc8ff, 0.3);
  fill.position.set(1, 0.8, -1);
  scene.add(fill);

  const geometry = new THREE.BoxGeometry(1, 1, 1);
  const material = new THREE.MeshLambertMaterial({ color: 0xffffff });
  const terrain = new THREE.InstancedMesh(geometry, material, N * N);
  terrain.instanceMatrix.setUsage(THREE.StaticDrawUsage);

  const dummy = new THREE.Object3D();
  const tmp = new THREE.Color();
  const relief = new Float32Array(N * N * 3);
  const surface = new Float32Array(N * N * 3);

  function hyps(h) {
    if (h <= W.sea) return [0.10, 0.27, 0.46];
    const t = (h - W.sea) / Math.max(1, maxH - W.sea);
    if (t < 0.22) return [0.23, 0.45, 0.35];
    if (t < 0.45) return [0.38, 0.52, 0.40];
    if (t < 0.68) return [0.52, 0.53, 0.50];
    if (t < 0.85) return [0.62, 0.62, 0.63];
    return [0.90, 0.95, 1.00];
  }

  let n = 0;
  for (let gz = 0; gz < N; gz++) {
    for (let gx = 0; gx < N; gx++) {
      const i = gz * N + gx;
      const h = heights[i];
      const height = Math.max(1, h - baseY);
      const x = W.minX + gx * step + step / 2;
      const z = W.minZ + gz * step + step / 2;
      dummy.position.set(x, baseY + height / 2, z);
      dummy.scale.set(step, height, step);
      dummy.updateMatrix();
      terrain.setMatrixAt(n, dummy.matrix);

      const hR = heights[gz * N + Math.min(N - 1, gx + 1)];
      const hD = heights[Math.min(N - 1, gz + 1) * N + gx];
      const slope = Math.max(Math.abs(h - hR), Math.abs(h - hD)) / step;
      const shade = 1 - Math.min(0.55, slope / 7);
      const rc = hyps(h);
      relief[i * 3] = rc[0] * shade;
      relief[i * 3 + 1] = rc[1] * shade;
      relief[i * 3 + 2] = rc[2] * shade;
      surface[i * 3] = surfaceBytes[i * 3] / 255 * shade;
      surface[i * 3 + 1] = surfaceBytes[i * 3 + 1] / 255 * shade;
      surface[i * 3 + 2] = surfaceBytes[i * 3 + 2] / 255 * shade;
      n++;
    }
  }
  terrain.count = n;

  // Malla suave: la superficie real sin columnas verticales.
  const smoothPositions = new Float32Array(N * N * 3);
  const smoothColors = new Float32Array(N * N * 3);
  const smoothIndices = [];
  for (let gz = 0; gz < N; gz++) {
    for (let gx = 0; gx < N; gx++) {
      const i = gz * N + gx;
      smoothPositions[i * 3] = W.minX + gx * step;
      smoothPositions[i * 3 + 1] = heights[i];
      smoothPositions[i * 3 + 2] = W.minZ + gz * step;
    }
  }
  for (let gz = 0; gz < N - 1; gz++) {
    for (let gx = 0; gx < N - 1; gx++) {
      const a = gz * N + gx;
      const b = a + 1;
      const c = a + N;
      const d = c + 1;
      smoothIndices.push(a, c, b, b, c, d);
    }
  }
  const smoothGeo = new THREE.BufferGeometry();
  smoothGeo.setAttribute('position', new THREE.BufferAttribute(smoothPositions, 3));
  smoothGeo.setAttribute('color', new THREE.BufferAttribute(smoothColors, 3));
  smoothGeo.setIndex(smoothIndices);
  smoothGeo.computeVertexNormals();
  const smoothMat = new THREE.MeshLambertMaterial({ vertexColors: true, side: THREE.DoubleSide });
  const smooth = new THREE.Mesh(smoothGeo, smoothMat);
  smooth.visible = true;
  terrain.visible = false;
  scene.add(smooth);

  for (let i = 0; i < n; i++) {
    tmp.setRGB(surface[i * 3], surface[i * 3 + 1], surface[i * 3 + 2]);
    terrain.setColorAt(i, tmp);
    smoothColors[i * 3] = relief[i * 3];
    smoothColors[i * 3 + 1] = relief[i * 3 + 1];
    smoothColors[i * 3 + 2] = relief[i * 3 + 2];
  }
  if (terrain.instanceColor) terrain.instanceColor.needsUpdate = true;
  smoothGeo.attributes.color.needsUpdate = true;
  scene.add(terrain);

  // ---------------------------------------------------------------
  // Texturas: atlas procedural (16x16 px por material) para no
  // depender de assets externos. Cada celda toma su tile según mats.
  // ---------------------------------------------------------------
  const ATLAS_COLS = 8, TILE = 16, ATLAS = ATLAS_COLS * TILE;
  const MAT_STYLE = {
    stone:      { base: [128, 128, 128], noise: 26, kind: 'speck' },
    cobble:     { base: [104, 104, 104], noise: 30, kind: 'cobble' },
    dirt:       { base: [116, 86, 58],  noise: 24, kind: 'speck' },
    grass:      { base: [86, 142, 60],  noise: 26, kind: 'speck' },
    sand:       { base: [214, 198, 143], noise: 18, kind: 'speck' },
    gravel:     { base: [136, 132, 128], noise: 40, kind: 'cobble' },
    snow:       { base: [238, 246, 250], noise: 10, kind: 'speck' },
    ice:        { base: [176, 214, 238], noise: 14, kind: 'speck' },
    water:      { base: [48, 96, 156],  noise: 10, kind: 'water' },
    lava:       { base: [120, 44, 12],   noise: 22, kind: 'lava' },
    netherrack: { base: [58, 24, 26],    noise: 24, kind: 'cobble' },
    basalt:     { base: [34, 32, 38],    noise: 14, kind: 'lines' },
    blackstone: { base: [24, 22, 26],    noise: 16, kind: 'speck' },
    magma:      { base: [88, 32, 14],    noise: 20, kind: 'lava' },
    soul:       { base: [96, 76, 56],    noise: 22, kind: 'speck' },
    end_stone:  { base: [204, 198, 158], noise: 16, kind: 'speck' },
    purpur:     { base: [168, 124, 166], noise: 16, kind: 'bricks' },
    wood:       { base: [110, 80, 50],   noise: 16, kind: 'lines' },
    leaves:     { base: [62, 110, 50],   noise: 32, kind: 'speck' },
    terracotta: { base: [140, 90, 70],   noise: 16, kind: 'bricks' },
    quartz:     { base: [230, 226, 216], noise: 10, kind: 'speck' },
    gold:       { base: [214, 182, 86],  noise: 14, kind: 'speck' },
    obsidian:   { base: [20, 16, 30],    noise: 12, kind: 'speck' },
    moss:       { base: [90, 130, 66],   noise: 26, kind: 'speck' },
    crimson:    { base: [122, 58, 74],   noise: 24, kind: 'speck' },
    deepslate:  { base: [74, 74, 78],    noise: 18, kind: 'lines' }
  };
  function azar(seed) {
    let t = seed >>> 0;
    return function () {
      t += 0x6D2B79F5;
      let r = t;
      r = Math.imul(r ^ r >>> 15, r | 1);
      r ^= r + Math.imul(r ^ r >>> 7, r | 61);
      return ((r ^ r >>> 14) >>> 0) / 4294967296;
    };
  }
  function crearAtlas() {
    const canvas = document.createElement('canvas');
    canvas.width = canvas.height = ATLAS;
    const ctx = canvas.getContext('2d');
    const img = ctx.createImageData(ATLAS, ATLAS);
    const datos = img.data;
    const nombres = W.matNames || [];
    for (let m = 0; m < nombres.length; m++) {
      const estilo = MAT_STYLE[nombres[m]]
        || { base: [120, 120, 120], noise: 20, kind: 'speck' };
      const tx = (m % ATLAS_COLS) * TILE;
      const ty = Math.floor(m / ATLAS_COLS) * TILE;
      const rnd = azar(0x9E3779B9 ^ (m * 2654435761));
      const base = estilo.base;
      for (let y = 0; y < TILE; y++) {
        for (let x = 0; x < TILE; x++) {
          let r = base[0], g = base[1], b = base[2];
          const n = (rnd() - 0.5) * 2 * estilo.noise;
          r += n; g += n; b += n;
          // El paso del visor es de 3 bloques: cada tile lleva un 3x3
          // de "bloques" para que la textura quede a escala.
          const sx = Math.floor(x * 3 / TILE), sy = Math.floor(y * 3 / TILE);
          const celda = (sx * 7 + sy * 13 + m * 31) % 7;
          const v = (celda - 3) * 7;
          r += v; g += v; b += v;
          if (estilo.kind === 'lines' && (y % 5 === 0 || x % 7 === 0)) {
            r -= 20; g -= 20; b -= 20;
          }
          if (estilo.kind === 'bricks' &&
              (y % 8 === 0 || (x + (y < 8 ? 0 : 8)) % 16 === 0)) {
            r -= 30; g -= 30; b -= 30;
          }
          if (estilo.kind === 'cobble') {
            const cx = Math.floor(x / 5), cy = Math.floor(y / 5);
            const v = ((cx * 7 + cy * 13) % 5) * 9 - 18;
            r += v; g += v; b += v;
          }
          if (estilo.kind === 'water' &&
              (y + Math.round(Math.sin(x / 2.2) * 1.6)) % 6 === 0) {
            r += 18; g += 24; b += 28;
          }
          if (estilo.kind === 'lava' && rnd() > 0.86) {
            r = 250; g += 70; b += 10;
          }
          const o = ((ty + y) * ATLAS + tx + x) * 4;
          datos[o] = Math.max(0, Math.min(255, r));
          datos[o + 1] = Math.max(0, Math.min(255, g));
          datos[o + 2] = Math.max(0, Math.min(255, b));
          datos[o + 3] = 255;
        }
      }
    }
    ctx.putImageData(img, 0, 0);
    const tex = new THREE.CanvasTexture(canvas);
    tex.flipY = false;
    tex.magFilter = THREE.NearestFilter;
    tex.minFilter = THREE.NearestFilter;
    tex.generateMipmaps = false;
    return tex;
  }

  const tPos = [], tUv = [], tCol = [], tIdx = [];
  let tvi = 0;
  const totalMats = (W.matNames || []).length || 1;
  for (let gz = 0; gz < N - 1; gz++) {
    for (let gx = 0; gx < N - 1; gx++) {
      const i = gz * N + gx;
      const mi = (mats[i] % totalMats + totalMats) % totalMats;
      const tx = (mi % ATLAS_COLS) * TILE;
      const ty = Math.floor(mi / ATLAS_COLS) * TILE;
      const u0 = (tx + 0.5) / ATLAS, u1 = (tx + TILE - 0.5) / ATLAS;
      const v0 = (ty + 0.5) / ATLAS, v1 = (ty + TILE - 0.5) / ATLAS;
      const x0 = W.minX + gx * step, x1 = x0 + step;
      const z0 = W.minZ + gz * step, z1 = z0 + step;
      const h00 = heights[i], h10 = heights[i + 1];
      const h01 = heights[i + N], h11 = heights[i + N + 1];
      const hR = heights[gz * N + Math.min(N - 1, gx + 1)];
      const hD = heights[Math.min(N - 1, gz + 1) * N + gx];
      const slope = Math.max(Math.abs(h00 - hR), Math.abs(h00 - hD)) / step;
      const shade = 1 - Math.min(0.5, slope / 8);
      tPos.push(x0, h00, z0, x1, h10, z0, x1, h11, z1, x0, h01, z1);
      tUv.push(u0, v0, u1, v0, u1, v1, u0, v1);
      for (let k = 0; k < 4; k++) tCol.push(shade, shade, shade);
      tIdx.push(tvi, tvi + 2, tvi + 1, tvi, tvi + 3, tvi + 2);
      tvi += 4;
    }
  }
  const texGeo = new THREE.BufferGeometry();
  texGeo.setAttribute('position', new THREE.Float32BufferAttribute(tPos, 3));
  texGeo.setAttribute('uv', new THREE.Float32BufferAttribute(tUv, 2));
  texGeo.setAttribute('color', new THREE.Float32BufferAttribute(tCol, 3));
  texGeo.setIndex(tIdx);
  texGeo.computeVertexNormals();
  const texMat = new THREE.MeshLambertMaterial({
    map: crearAtlas(), vertexColors: true, side: THREE.DoubleSide
  });
  const textured = new THREE.Mesh(texGeo, texMat);
  scene.add(textured);

  textured.visible = true;
  smooth.visible = false;
  terrain.visible = false;

  const waterGeo = new THREE.PlaneGeometry(W.width * step * 1.6, W.height * step * 1.6);
  const waterMat = new THREE.MeshPhongMaterial({
    color: 0x2e6fae, transparent: true, opacity: 0.55,
    depthWrite: false, shininess: 90, side: THREE.DoubleSide
  });
  const water = new THREE.Mesh(waterGeo, waterMat);
  water.rotation.x = -Math.PI / 2;
  water.position.set(0, W.sea + 0.15, 0);
  water.visible = W.minHeight <= W.sea;
  if (!water.visible) document.getElementById('btnWater').classList.remove('on');
  scene.add(water);

  const treeGroup = new THREE.Group();
  const canopyGeo = new THREE.ConeGeometry(2.7, 7.5, 7);
  const trunkGeo = new THREE.BoxGeometry(1.15, 4.2, 1.15);
  const canopyMat = new THREE.MeshLambertMaterial({ color: 0x3f7d38 });
  const trunkMat = new THREE.MeshLambertMaterial({ color: 0x6b4a2f });
  const canopy = new THREE.InstancedMesh(canopyGeo, canopyMat, Math.max(1, W.trees.length));
  const trunk = new THREE.InstancedMesh(trunkGeo, trunkMat, Math.max(1, W.trees.length));
  const PALETAS_ARBOL = {
    emberhold: [0x8a2b3a, 0x2b7a6a, 0xa9362f, 0x6a2b4a],
    frostveil: [0x2e6b45, 0x357a5a, 0x3f7d5a, 0x2a5a46],
    nightfall: [0x6a5a8a, 0x8a6a9a, 0x4a3a5a, 0x7a5a7a],
    evergrove: [0x2e6b45, 0x4b8b3a, 0x2f7a4a, 0x8a3a3a]
  };
  const treeColors = PALETAS_ARBOL[clave] || PALETAS_ARBOL.evergrove;
  W.trees.forEach((t, i) => {
    const x = t[0] + 0.5, y = t[1], z = t[2] + 0.5;
    dummy.position.set(x, y + 2.1, z);
    dummy.scale.set(1, 1, 1);
    dummy.rotation.set(0, 0, 0);
    dummy.updateMatrix();
    trunk.setMatrixAt(i, dummy.matrix);
    dummy.position.set(x, y + 7.2, z);
    dummy.updateMatrix();
    canopy.setMatrixAt(i, dummy.matrix);
    canopy.setColorAt(i, new THREE.Color(treeColors[t[3] % treeColors.length]));
  });
  canopy.count = trunk.count = W.trees.length;
  if (canopy.instanceColor) canopy.instanceColor.needsUpdate = true;
  treeGroup.add(trunk, canopy);
  scene.add(treeGroup);
  if (!W.trees.length) {
    document.getElementById('btnTrees').style.display = 'none';
  }

  const raycaster = new THREE.Raycaster();
  const pointer = new THREE.Vector2();
  const hoverEl = document.getElementById('hover');
  renderer.domElement.addEventListener('pointermove', (ev) => {
    pointer.x = (ev.clientX / innerWidth) * 2 - 1;
    pointer.y = -(ev.clientY / innerHeight) * 2 + 1;
    raycaster.setFromCamera(pointer, camera);
    const hitSmooth = smooth.visible
      ? raycaster.intersectObject(smooth, false)[0] : null;
    if (hitSmooth) {
      const gx = Math.max(0, Math.min(N - 1,
        Math.round((hitSmooth.point.x - W.minX) / step)));
      const gz = Math.max(0, Math.min(N - 1,
        Math.round((hitSmooth.point.z - W.minZ) / step)));
      const h = heights[gz * N + gx];
      hoverEl.innerHTML = 'x <b>' + (W.minX + gx * step) + '</b> · z <b>' +
        (W.minZ + gz * step) + '</b> · altura <b>' + h + '</b>';
      return;
    }
    const hit = raycaster.intersectObject(terrain, false)[0];
    if (hit && hit.instanceId != null) {
      const id = hit.instanceId;
      const gz = Math.floor(id / N), gx = id % N;
      const h = heights[id];
      hoverEl.innerHTML = 'x <b>' + (W.minX + gx * step) + '</b> · z <b>' +
        (W.minZ + gz * step) + '</b> · altura <b>' + h + '</b>';
    }
  });

  const toast = document.getElementById('toast');
  let toastTimer = 0;
  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
  }

  const sel = document.getElementById('worldSel');
  chaves.forEach(function (k) {
    const op = document.createElement('option');
    op.value = k;
    op.textContent = dados[k].name;
    if (k === clave) op.selected = true;
    sel.appendChild(op);
  });
  sel.onchange = function () { location.search = '?world=' + sel.value; };

  const btnTextures = document.getElementById('btnTextures');
  const btnRelief = document.getElementById('btnRelief');
  const btnBlocks = document.getElementById('btnBlocks');
  const btnWater = document.getElementById('btnWater');
  const btnTrees = document.getElementById('btnTrees');
  const btnWire = document.getElementById('btnWire');
  let modo = 'texturas';
  function setModo(m) {
    modo = m;
    textured.visible = m === 'texturas';
    smooth.visible = m === 'relieve';
    terrain.visible = m === 'bloques';
    btnTextures.classList.toggle('on', m === 'texturas');
    btnRelief.classList.toggle('on', m === 'relieve');
    btnBlocks.classList.toggle('on', m === 'bloques');
    showToast(m === 'texturas' ? 'Texturas por bloque'
      : m === 'relieve' ? 'Color por relieve' : 'Vista de bloques');
  }
  btnTextures.onclick = () => setModo('texturas');
  btnRelief.onclick = () => setModo('relieve');
  btnWater.onclick = () => {
    water.visible = !water.visible;
    btnWater.classList.toggle('on', water.visible);
  };
  btnTrees.onclick = () => {
    treeGroup.visible = !treeGroup.visible;
    btnTrees.classList.toggle('on', treeGroup.visible);
    if (!W.trees.length) showToast('Esta exportación no detectó árboles de tronco.');
  };
  btnWire.onclick = () => {
    const w = !texMat.wireframe;
    texMat.wireframe = w;
    smoothMat.wireframe = w;
    material.wireframe = w;
    texMat.needsUpdate = true;
    smoothMat.needsUpdate = true;
    material.needsUpdate = true;
    btnWire.classList.toggle('on', w);
  };
  btnBlocks.onclick = () => setModo('bloques');
  document.getElementById('btnTop').onclick = () => {
    camera.position.set(0.1, area * 1.5, 0.1);
    controls.target.copy(center);
    controls.update();
  };
  document.getElementById('btnReset').onclick = () => {
    camera.position.set(area * 0.75, area * 0.55, area * 0.75);
    controls.target.copy(center);
    controls.update();
  };

  addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  }

  document.getElementById('loading').classList.add('hide');
  animate();
})();
</script>
</body>
</html>
