<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AigenCraft · Visor 3D</title>
<style>
  :root { color-scheme: dark; }
  html,body { margin:0; height:100%; overflow:hidden; background:#a9c9e8;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  #app { position:fixed; inset:0; }
  .panel { position:fixed; z-index:10; background:rgba(12,22,34,.78);
    border:1px solid rgba(140,190,230,.25); border-radius:12px;
    color:#e8f2fb; box-shadow:0 12px 40px rgba(0,0,0,.25);
    backdrop-filter: blur(10px); }
  #info { top:18px; left:18px; padding:14px 18px; max-width:min(420px,80vw); }
  #info h1 { margin:0 0 4px; font-size:16px; letter-spacing:.08em; font-weight:600; }
  #info .sub { color:#9fc3df; font-size:12px; line-height:1.6; }
  #info .num { color:#ffd98a; }
  #hud { bottom:18px; left:18px; padding:10px 14px; font-size:12px;
    color:#bfd8ee; min-width:230px; }
  #hud b { color:#fff; font-weight:600; }
  #controls { top:18px; right:18px; padding:10px; display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; max-width:360px; }
  button { font:inherit; font-size:11px; color:#dcecfb; background:rgba(70,120,170,.25);
    border:1px solid rgba(150,200,240,.3); border-radius:8px; padding:7px 10px;
    cursor:pointer; transition:.15s; }
  button:hover { background:rgba(100,160,220,.4); }
  button.on { background:#3d8fd1; border-color:#8fd0ff; color:#fff; }
  select { font:inherit; font-size:11px; color:#dcecfb; background:rgba(70,120,170,.25);
    border:1px solid rgba(150,200,240,.3); border-radius:8px; padding:7px 8px;
    cursor:pointer; }
  #loading { position:fixed; inset:0; display:grid; place-items:center; z-index:50;
    background:#0b1622; color:#bfe0ff; font-size:14px; letter-spacing:.1em; }
  #loading.hide { display:none; }
  .hint { color:#8fb6d4; font-size:11px; margin-top:6px; }
  #sel { right:18px; bottom:18px; padding:10px 14px; min-width:210px; display:none; }
  #sel .coord { color:#ffd98a; font-size:15px; margin:4px 0 2px; }
  #sel .fila { display:flex; gap:6px; margin-top:8px; }
  #toast { position:fixed; left:50%; bottom:22px; transform:translateX(-50%);
    z-index:20; background:rgba(12,22,34,.9); color:#fff; padding:8px 14px;
    border-radius:8px; font-size:12px; opacity:0; transition:.3s; pointer-events:none; }
  #toast.show { opacity:1; }
</style>
</head>
<body>
<div id="app"></div>
<div id="loading">CARGANDO MUNDO…</div>
<div id="info" class="panel">
  <h1>AIGENCRAFT · VISOR 3D</h1>
  <div class="sub">
    <span id="worldName">—</span> · seed <span class="num" id="seed">—</span><br>
    Área <span class="num" id="area">—</span> · paso <span class="num" id="paso">—</span> bloques<br>
    <span id="range"></span>
  </div>
</div>
<div id="controls" class="panel">
  <select id="worldSel" title="Reino"></select>
  <button id="btnTextures" class="on">Texturas</button>
  <button id="btnRelief">Relieve</button>
  <button id="btnWater" class="on">Agua</button>
  <button id="btnTrees" class="on">Árboles</button>
  <button id="btnWire">Aristas</button>
  <button id="btnFine" class="on">1:1</button>
  <button id="btnTop">Vista superior</button>
  <button id="btnReset">Reiniciar vista</button>
</div>
<div id="hud" class="panel">
  <div>Arrastrá para girar · scroll para acercar</div>
  <div class="hint" id="hover">Pasá el mouse sobre el terreno para ver coordenadas.</div>
</div>
<div id="sel" class="panel">
  <div class="hint">Bloque seleccionado</div>
  <div class="coord" id="selCoord">—</div>
  <div class="hint" id="selInfo">—</div>
  <div class="fila">
    <button id="btnCopy">Copiar</button>
    <button id="btnClear">Limpiar</button>
  </div>
</div>
<div id="toast"></div>

<script src="three.min.js"></script>
<script src="OrbitControls.js"></script>
<script src="worlds-data.js"></script>
<script>
(function () {
  'use strict';
  const dados = window.WORLDS || {};
  const chaves = Object.keys(dados);
  const pedido = new URLSearchParams(location.search).get('world');
  const clave = pedido && dados[pedido] ? pedido : chaves[0];
  const W = dados[clave];
  if (!W) { document.getElementById('loading').textContent = 'No se encontró worlds-data.js'; return; }

  function b64ToBuffer(b64) {
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes.buffer;
  }

  const heights = new Uint16Array(b64ToBuffer(W.heights));
  const mats = new Uint8Array(b64ToBuffer(W.mats));
  const surfaceBytes = new Uint8Array(b64ToBuffer(W.colors));
  const N = W.width;
  const step = W.step;
  const baseY = Math.max(0, W.minHeight - 2);
  const maxH = Math.max(1, W.maxHeight);

  document.getElementById('worldName').textContent = W.name;
  document.getElementById('seed').textContent = W.seed;
  document.getElementById('area').textContent = (W.width * W.step) + '×' + (W.height * W.step);
  document.getElementById('paso').textContent = W.fine
    ? '1:1 detalle / ' + W.step + ':1 fondo' : W.step;
  document.title = 'AigenCraft · ' + W.name + ' · Visor 3D';
  document.getElementById('range').textContent =
    'Alturas ' + W.minHeight + '–' + W.maxHeight + ' · mar ' + W.sea;

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xa9c9e8);
  scene.fog = new THREE.Fog(0xa9c9e8, 500, 2400);

  const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 1, 6000);
  const medio = Math.round((W.minHeight + W.maxHeight) / 2);
  const center = new THREE.Vector3(0, medio, 0);
  const area = W.width * W.step;
  camera.position.set(area * 0.75, area * 0.55, area * 0.75);

  const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.outputEncoding = THREE.sRGBEncoding;
  document.getElementById('app').appendChild(renderer.domElement);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.075;
  controls.target.copy(center);
  controls.minDistance = 40;
  controls.maxDistance = 2600;
  controls.maxPolarAngle = Math.PI * 0.495;

  scene.add(new THREE.HemisphereLight(0xdceeff, 0x304050, 0.85));
  const sun = new THREE.DirectionalLight(0xfff4e6, 1.15);
  sun.position.set(-1.2, 1.8, 0.9);
  scene.add(sun);
  const fill = new THREE.DirectionalLight(0x9dc8ff, 0.3);
  fill.position.set(1, 0.8, -1);
  scene.add(fill);

  const geometry = new THREE.BoxGeometry(1, 1, 1);
  const material = new THREE.MeshLambertMaterial({ color: 0xffffff });
  const terrain = new THREE.InstancedMesh(geometry, material, N * N);
  terrain.instanceMatrix.setUsage(THREE.StaticDrawUsage);

  const dummy = new THREE.Object3D();
  const tmp = new THREE.Color();
  const relief = new Float32Array(N * N * 3);
  const surface = new Float32Array(N * N * 3);

  function hyps(h) {
    if (h <= W.sea) return [0.10, 0.27, 0.46];
    const t = (h - W.sea) / Math.max(1, maxH - W.sea);
    if (t < 0.22) return [0.23, 0.45, 0.35];
    if (t < 0.45) return [0.38, 0.52, 0.40];
    if (t < 0.68) return [0.52, 0.53, 0.50];
    if (t < 0.85) return [0.62, 0.62, 0.63];
    return [0.90, 0.95, 1.00];
  }

  let n = 0;
  for (let gz = 0; gz < N; gz++) {
    for (let gx = 0; gx < N; gx++) {
      const i = gz * N + gx;
      const h = heights[i];
      const height = Math.max(1, h - baseY);
      const x = W.minX + gx * step + step / 2;
      const z = W.minZ + gz * step + step / 2;
      dummy.position.set(x, baseY + height / 2, z);
      dummy.scale.set(step, height, step);
      dummy.updateMatrix();
      terrain.setMatrixAt(n, dummy.matrix);

      const hR = heights[gz * N + Math.min(N - 1, gx + 1)];
      const hD = heights[Math.min(N - 1, gz + 1) * N + gx];
      const slope = Math.max(Math.abs(h - hR), Math.abs(h - hD)) / step;
      const shade = 1 - Math.min(0.55, slope / 7);
      const rc = hyps(h);
      relief[i * 3] = rc[0] * shade;
      relief[i * 3 + 1] = rc[1] * shade;
      relief[i * 3 + 2] = rc[2] * shade;
      surface[i * 3] = surfaceBytes[i * 3] / 255 * shade;
      surface[i * 3 + 1] = surfaceBytes[i * 3 + 1] / 255 * shade;
      surface[i * 3 + 2] = surfaceBytes[i * 3 + 2] / 255 * shade;
      n++;
    }
  }
  terrain.count = n;

  // Malla suave: la superficie real sin columnas verticales.
  const smoothPositions = new Float32Array(N * N * 3);
  const smoothColors = new Float32Array(N * N * 3);
  const smoothIndices = [];
  for (let gz = 0; gz < N; gz++) {
    for (let gx = 0; gx < N; gx++) {
      const i = gz * N + gx;
      smoothPositions[i * 3] = W.minX + gx * step;
      smoothPositions[i * 3 + 1] = heights[i];
      smoothPositions[i * 3 + 2] = W.minZ + gz * step;
    }
  }
  for (let gz = 0; gz < N - 1; gz++) {
    for (let gx = 0; gx < N - 1; gx++) {
      const a = gz * N + gx;
      const b = a + 1;
      const c = a + N;
      const d = c + 1;
      smoothIndices.push(a, c, b, b, c, d);
    }
  }
  const smoothGeo = new THREE.BufferGeometry();
  smoothGeo.setAttribute('position', new THREE.BufferAttribute(smoothPositions, 3));
  smoothGeo.setAttribute('color', new THREE.BufferAttribute(smoothColors, 3));
  smoothGeo.setIndex(smoothIndices);
  smoothGeo.computeVertexNormals();
  const smoothMat = new THREE.MeshLambertMaterial({ vertexColors: true, side: THREE.DoubleSide });
  const smooth = new THREE.Mesh(smoothGeo, smoothMat);
  smooth.visible = true;
  terrain.visible = false;
  scene.add(smooth);

  for (let i = 0; i < n; i++) {
    tmp.setRGB(surface[i * 3], surface[i * 3 + 1], surface[i * 3 + 2]);
    terrain.setColorAt(i, tmp);
    smoothColors[i * 3] = relief[i * 3];
    smoothColors[i * 3 + 1] = relief[i * 3 + 1];
    smoothColors[i * 3 + 2] = relief[i * 3 + 2];
  }
  if (terrain.instanceColor) terrain.instanceColor.needsUpdate = true;
  smoothGeo.attributes.color.needsUpdate = true;
  scene.add(terrain);

  // ---------------------------------------------------------------
  // Bloques con texturas reales de Minecraft, una malla por material.
  // La superficie se dibuja como un voxel: tapa plana por celda y
  // paredes verticales donde el vecino queda más bajo.
  // ---------------------------------------------------------------
  const grupoBloques = new THREE.Group();
  scene.add(grupoBloques);

  function cargarTextura(url, tinte) {
    return new Promise((resolve) => {
      const img = new Image();
      img.onload = () => {
        const c = document.createElement('canvas');
        c.width = c.height = 16;
        const ctx = c.getContext('2d');
        ctx.drawImage(img, 0, 0, 16, 16, 0, 0, 16, 16);
        if (tinte) {
          ctx.globalCompositeOperation = 'multiply';
          ctx.fillStyle = tinte;
          ctx.fillRect(0, 0, 16, 16);
        }
        const tex = new THREE.CanvasTexture(c);
        tex.magFilter = THREE.NearestFilter;
        tex.minFilter = THREE.NearestFilter;
        tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
        tex.encoding = THREE.sRGBEncoding;
        tex.needsUpdate = true;
        resolve(tex);
      };
      img.onerror = () => {
        const c = document.createElement('canvas');
        c.width = c.height = 16;
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#8a8a8a';
        ctx.fillRect(0, 0, 16, 16);
        const tex = new THREE.CanvasTexture(c);
        tex.magFilter = THREE.NearestFilter;
        tex.minFilter = THREE.NearestFilter;
        resolve(tex);
      };
      img.src = url;
    });
  }

  const TINTES = { grass: '#79c05a', water: '#3f76e4' };
  const nombresMat = W.matNames || [];
  const texturas = {};
  const cargas = nombresMat.map((nombre) => Promise.all([
    cargarTextura('textures/' + nombre + '_top.png', TINTES[nombre] || null),
    cargarTextura('textures/' + nombre + '_side.png', null)
  ]).then(([top, side]) => { texturas[nombre] = { top, side }; }));

  function construirBloques() {
    const geos = {};
    const porMaterial = (mat, tipo) => {
      const k = mat + '|' + tipo;
      if (!geos[k]) geos[k] = { pos: [], uv: [], idx: [], n: 0 };
      return geos[k];
    };
    const cuad = (g, a, b, c, d, ua, ub, uc, ud) => {
      const base = g.n;
      g.pos.push(a[0], a[1], a[2], b[0], b[1], b[2], c[0], c[1], c[2], d[0], d[1], d[2]);
      g.uv.push(ua[0], ua[1], ub[0], ub[1], uc[0], uc[1], ud[0], ud[1]);
      g.idx.push(base, base + 2, base + 1, base, base + 3, base + 2);
      g.n += 4;
    };
    const hEn = (gx, gz) => (gx < 0 || gz < 0 || gx >= N || gz >= N)
      ? -9999 : heights[gz * N + gx];

    for (let gz = 0; gz < N; gz++) {
      for (let gx = 0; gx < N; gx++) {
        const i = gz * N + gx;
        const mat = nombresMat[mats[i]] || 'stone';
        const y = heights[i];
        const x0 = W.minX + gx * step, x1 = x0 + step;
        const z0 = W.minZ + gz * step, z1 = z0 + step;
        const gTop = porMaterial(mat, 'top');
        cuad(gTop,
          [x0, y, z0], [x1, y, z0], [x1, y, z1], [x0, y, z1],
          [x0, z0], [x1, z0], [x1, z1], [x0, z1]);
        const gSide = porMaterial(mat, 'side');
        const hN = hEn(gx, gz - 1);
        if (hN < y) {
          cuad(gSide, [x0, hN, z0], [x1, hN, z0], [x1, y, z0], [x0, y, z0],
            [x0, hN], [x1, hN], [x1, y], [x0, y]);
        }
        const hS = hEn(gx, gz + 1);
        if (hS < y) {
          cuad(gSide, [x1, hS, z1], [x0, hS, z1], [x0, y, z1], [x1, y, z1],
            [x1, hS], [x0, hS], [x0, y], [x1, y]);
        }
        const hW = hEn(gx - 1, gz);
        if (hW < y) {
          cuad(gSide, [x0, hW, z1], [x0, hW, z0], [x0, y, z0], [x0, y, z1],
            [z1, hW], [z0, hW], [z0, y], [z1, y]);
        }
        const hE = hEn(gx + 1, gz);
        if (hE < y) {
          cuad(gSide, [x1, hE, z0], [x1, hE, z1], [x1, y, z1], [x1, y, z0],
            [z0, hE], [z1, hE], [z1, y], [z0, y]);
        }
      }
    }

    Object.keys(geos).forEach((k) => {
      const g = geos[k];
      if (!g.n) return;
      const geom = new THREE.BufferGeometry();
      geom.setAttribute('position', new THREE.Float32BufferAttribute(g.pos, 3));
      geom.setAttribute('uv', new THREE.Float32BufferAttribute(g.uv, 2));
      geom.setIndex(g.idx);
      geom.computeVertexNormals();
      const partes = k.split('|');
      const tex = texturas[partes[0]]
        ? texturas[partes[0]][partes[1]] : null;
      const mat = new THREE.MeshLambertMaterial({
        map: tex, side: THREE.DoubleSide,
        polygonOffset: true, polygonOffsetFactor: 2, polygonOffsetUnits: 4
      });
      mat.name = k;
      grupoBloques.add(new THREE.Mesh(geom, mat));
    });
  }


  // ---------------------------------------------------------------
  // Detalle 1:1 por tiles. Cada tile es un .bin con alturas y
  // materiales; se cargan los que rodean el objetivo de la cámara.
  // ---------------------------------------------------------------
  const fine = W.fine || null;
  const grupoTiles = new THREE.Group();
  grupoTiles.visible = false;
  grupoTiles.renderOrder = 1;
  scene.add(grupoTiles);
  const datosTiles = new Map();
  const materialesTile = new Map();
  const tilesVisibles = [];
  let firmaTiles = '';
  let fineActivo = !!fine;

  function materialTile(mat, tipo) {
    const k = mat + '|' + tipo;
    let m = materialesTile.get(k);
    if (!m) {
      const tex = texturas[mat] ? texturas[mat][tipo] : null;
      m = new THREE.MeshLambertMaterial({ map: tex, side: THREE.DoubleSide });
      materialesTile.set(k, m);
    }
    return m;
  }

  function claveTile(ix, iz) { return ix + '|' + iz; }

  function cargarTile(ix, iz) {
    const k = claveTile(ix, iz);
    if (datosTiles.has(k)) return Promise.resolve(datosTiles.get(k));
    if (ix < 0 || iz < 0 || ix >= fine.cols || iz >= fine.rows) {
      return Promise.resolve(null);
    }
    return fetch(fine.url + '/' + ix + '_' + iz + '.bin').then((r) => {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.arrayBuffer();
    }).then((buf) => {
      const dv = new DataView(buf);
      if (dv.getInt32(0, true) !== 0x54474941) throw new Error('Formato');
      const T = dv.getInt16(6, true);
      const n = dv.getInt32(12, true);
      let off = 16;
      const hs = new Int16Array(n);
      for (let i = 0; i < n; i++, off += 2) hs[i] = dv.getInt16(off, true);
      const ms = new Uint8Array(n);
      for (let i = 0; i < n; i++) ms[i] = dv.getUint8(off + i);
      const datos = { ix: ix, iz: iz, T: T, heights: hs, mats: ms };
      datosTiles.set(k, datos);
      return datos;
    });
  }

  function alturaBloque(wx, wz) {
    if (fine) {
      const ix = Math.floor((wx - fine.minX) / fine.tile);
      const iz = Math.floor((wz - fine.minZ) / fine.tile);
      const d = datosTiles.get(claveTile(ix, iz));
      if (d) {
        const lx = wx - (fine.minX + ix * fine.tile);
        const lz = wz - (fine.minZ + iz * fine.tile);
        if (lx >= 0 && lz >= 0 && lx < d.T && lz < d.T) {
          return d.heights[lz * d.T + lx];
        }
      }
    }
    const gx = Math.max(0, Math.min(N - 1, Math.round((wx - W.minX) / step)));
    const gz = Math.max(0, Math.min(N - 1, Math.round((wz - W.minZ) / step)));
    return heights[gz * N + gx];
  }

  function materialBloque(wx, wz) {
    if (fine) {
      const ix = Math.floor((wx - fine.minX) / fine.tile);
      const iz = Math.floor((wz - fine.minZ) / fine.tile);
      const d = datosTiles.get(claveTile(ix, iz));
      if (d) {
        const lx = wx - (fine.minX + ix * fine.tile);
        const lz = wz - (fine.minZ + iz * fine.tile);
        if (lx >= 0 && lz >= 0 && lx < d.T && lz < d.T) {
          const m = d.mats[lz * d.T + lx];
          return nombresMat[m] || 'stone';
        }
      }
    }
    return 'stone';
  }

  function limpiarTiles() {
    for (const hijo of grupoTiles.children) {
      if (hijo.geometry) hijo.geometry.dispose();
    }
    grupoTiles.clear();
  }

  function construirTiles() {
    limpiarTiles();
    const geos = {};
    const porMaterial = (mat, tipo) => {
      const k = mat + '|' + tipo;
      if (!geos[k]) geos[k] = { pos: [], uv: [], idx: [], n: 0 };
      return geos[k];
    };
    const cuad = (g, a, b, c, d, ua, ub, uc, ud) => {
      const base = g.n;
      g.pos.push(a[0], a[1], a[2], b[0], b[1], b[2], c[0], c[1], c[2], d[0], d[1], d[2]);
      g.uv.push(ua[0], ua[1], ub[0], ub[1], uc[0], uc[1], ud[0], ud[1]);
      g.idx.push(base, base + 2, base + 1, base, base + 3, base + 2);
      g.n += 4;
    };
    for (const par of tilesVisibles) {
      const d = datosTiles.get(claveTile(par[0], par[1]));
      if (!d) continue;
      const T = d.T;
      const x0t = fine.minX + d.ix * T;
      const z0t = fine.minZ + d.iz * T;
      for (let lz = 0; lz < T; lz++) {
        for (let lx = 0; lx < T; lx++) {
          const i = lz * T + lx;
          const mat = nombresMat[d.mats[i]] || 'stone';
          const y = d.heights[i];
          const x0 = x0t + lx, x1 = x0 + 1;
          const z0 = z0t + lz, z1 = z0 + 1;
          const gTop = porMaterial(mat, 'top');
          cuad(gTop, [x0, y, z0], [x1, y, z0], [x1, y, z1], [x0, y, z1],
            [x0, z0], [x1, z0], [x1, z1], [x0, z1]);
          const gSide = porMaterial(mat, 'side');
          const hN = alturaBloque(x0, z0 - 1);
          if (hN < y) {
            cuad(gSide, [x0, hN, z0], [x1, hN, z0], [x1, y, z0], [x0, y, z0],
              [x0, hN], [x1, hN], [x1, y], [x0, y]);
          }
          const hS = alturaBloque(x0, z0 + 1);
          if (hS < y) {
            cuad(gSide, [x1, hS, z1], [x0, hS, z1], [x0, y, z1], [x1, y, z1],
              [x1, hS], [x0, hS], [x0, y], [x1, y]);
          }
          const hW = alturaBloque(x0 - 1, z0);
          if (hW < y) {
            cuad(gSide, [x0, hW, z1], [x0, hW, z0], [x0, y, z0], [x0, y, z1],
              [z1, hW], [z0, hW], [z0, y], [z1, y]);
          }
          const hE = alturaBloque(x0 + 1, z0);
          if (hE < y) {
            cuad(gSide, [x1, hE, z0], [x1, hE, z1], [x1, y, z1], [x1, y, z0],
              [z0, hE], [z1, hE], [z1, y], [z0, y]);
          }
        }
      }
    }
    Object.keys(geos).forEach((k) => {
      const g = geos[k];
      if (!g.n) return;
      const geom = new THREE.BufferGeometry();
      geom.setAttribute('position', new THREE.Float32BufferAttribute(g.pos, 3));
      geom.setAttribute('uv', new THREE.Float32BufferAttribute(g.uv, 2));
      geom.setIndex(g.idx);
      geom.computeVertexNormals();
      const partes = k.split('|');
      grupoTiles.add(new THREE.Mesh(geom, materialTile(partes[0], partes[1])));
    });
    grupoTiles.visible = fineActivo && modo === 'texturas';
    if (seleccion && marcador.visible) {
      seleccionar(seleccion.x, seleccion.z);
    }
  }

  function actualizarTiles(forzar) {
    if (!fine || !fineActivo) return;
    const centroX = Math.floor((controls.target.x - fine.minX) / fine.tile);
    const centroZ = Math.floor((controls.target.z - fine.minZ) / fine.tile);
    let firma = '';
    const pedidos = [];
    for (let dz = -1; dz <= 1; dz++) {
      for (let dx = -1; dx <= 1; dx++) {
        const ix = Math.max(0, Math.min(fine.cols - 1, centroX + dx));
        const iz = Math.max(0, Math.min(fine.rows - 1, centroZ + dz));
        firma += ix + ',' + iz + ';';
        pedidos.push([ix, iz]);
      }
    }
    if (!forzar && firma === firmaTiles) return;
    firmaTiles = firma;
    Promise.all(pedidos.map(([ix, iz]) => cargarTile(ix, iz)
      .catch(() => null))).then(() => {
        if (firma !== firmaTiles) return;
        tilesVisibles.length = 0;
        for (const par of pedidos) {
          if (datosTiles.has(claveTile(par[0], par[1]))) {
            tilesVisibles.push(par);
          }
        }
        construirTiles();
      });
  }

  // Gancho de diagnóstico para pruebas automatizadas.
  window.__visor = {
    listo: () => document.getElementById('loading').classList.contains('hide'),
    estado: () => ({
      tiles: datosTiles.size,
      mallas: grupoTiles.children.length,
      visibles: tilesVisibles.length,
      fine: !!fine,
      fineActivo: fineActivo,
      modo: modo
    })
  };

  // Marcador del bloque elegido.
  const marcador = new THREE.Group();
  marcador.visible = false;
  scene.add(marcador);
  const cajaMarcador = new THREE.LineSegments(
    new THREE.EdgesGeometry(new THREE.BoxGeometry(1, 1, 1)),
    new THREE.LineBasicMaterial({ color: 0xffd24a, depthTest: false })
  );
  const hazMarcador = new THREE.Mesh(
    new THREE.CylinderGeometry(0.18, 0.18, 40, 6, 1, true),
    new THREE.MeshBasicMaterial({ color: 0xffd24a, depthTest: false,
      transparent: true, opacity: 0.85 })
  );
  hazMarcador.position.set(0, 20, 0);
  cajaMarcador.renderOrder = 999;
  hazMarcador.renderOrder = 999;
  marcador.add(cajaMarcador, hazMarcador);
  const pin = document.createElement('div');
  pin.style.cssText = 'position:fixed; z-index:15; pointer-events:none;' +
    'transform:translate(-50%,-100%); background:rgba(12,22,34,.88);' +
    'border:1px solid rgba(255,210,74,.75); border-radius:7px;' +
    'padding:3px 7px; font-size:11px; color:#ffd98a; display:none;' +
    'white-space:nowrap;';
  document.body.appendChild(pin);

  let seleccion = null;
  const selEl = document.getElementById('sel');
  const selCoord = document.getElementById('selCoord');
  const selInfo = document.getElementById('selInfo');

  function seleccionar(wx, wz) {
    const by = alturaBloque(wx, wz);
    const mat = materialBloque(wx, wz);
    seleccion = { x: wx, y: by, z: wz, mat: mat };
    marcador.position.set(wx + 0.5, by + 0.5, wz + 0.5);
    marcador.visible = true;
    selEl.style.display = 'block';
    selCoord.textContent = wx + ' ' + (by + 1) + ' ' + wz;
    pin.textContent = wx + ' ' + (by + 1) + ' ' + wz;
    const url = new URL(location.href);
    url.searchParams.set('x', wx);
    url.searchParams.set('z', wz);
    history.replaceState(null, '', url);
    pin.style.display = 'block';
    selInfo.textContent = 'Superficie y=' + by + ' · ' + mat +
      ' · /tp ' + (wx + 0.5) + ' ' + (by + 1) + ' ' + (wz + 0.5);
  }

  function bloqueBajoPuntero(ev) {
    pointer.x = (ev.clientX / innerWidth) * 2 - 1;
    pointer.y = -(ev.clientY / innerHeight) * 2 + 1;
    raycaster.setFromCamera(pointer, camera);
    if (grupoTiles.visible && grupoTiles.children.length) {
      const hit = raycaster.intersectObjects(grupoTiles.children, false)[0];
      if (hit) {
        return { x: Math.floor(hit.point.x), z: Math.floor(hit.point.z),
          exacto: true };
      }
    }
    const objetivos = grupoBloques.visible
      ? grupoBloques.children : (smooth.visible ? [smooth] : []);
    const hit = raycaster.intersectObjects(objetivos, false)[0];
    if (hit) {
      return { x: Math.floor(hit.point.x), z: Math.floor(hit.point.z),
        exacto: false };
    }
    return null;
  }

  document.getElementById('btnCopy').onclick = () => {
    if (!seleccion) return;
    const texto = seleccion.x + ' ' + (seleccion.y + 1) + ' ' + seleccion.z;
    if (navigator.clipboard) navigator.clipboard.writeText(texto);
    showToast('Copiado: ' + texto);
  };
  document.getElementById('btnClear').onclick = () => {
    seleccion = null;
    marcador.visible = false;
    pin.style.display = 'none';
    selEl.style.display = 'none';
  };

  let punteroAbajoX = 0;
  let punteroAbajoY = 0;
  renderer.domElement.addEventListener('pointerdown', (ev) => {
    punteroAbajoX = ev.clientX;
    punteroAbajoY = ev.clientY;
  });
  renderer.domElement.addEventListener('pointerup', (ev) => {
    if (Math.hypot(ev.clientX - punteroAbajoX,
      ev.clientY - punteroAbajoY) > 5) return;
    const bloque = bloqueBajoPuntero(ev);
    if (bloque) seleccionar(bloque.x, bloque.z);
  });

  Promise.all(cargas).then(() => {
    construirBloques();
    grupoBloques.visible = true;
    smooth.visible = false;
    document.getElementById('loading').classList.add('hide');
    actualizarTiles(true);
  });

  const waterGeo = new THREE.PlaneGeometry(W.width * step * 1.6, W.height * step * 1.6);
  const waterMat = new THREE.MeshPhongMaterial({
    color: 0x2e6fae, transparent: true, opacity: 0.55,
    depthWrite: false, shininess: 90, side: THREE.DoubleSide
  });
  const water = new THREE.Mesh(waterGeo, waterMat);
  water.rotation.x = -Math.PI / 2;
  water.position.set(0, W.sea + 0.15, 0);
  water.visible = W.minHeight <= W.sea;
  if (!water.visible) document.getElementById('btnWater').classList.remove('on');
  scene.add(water);

  const treeGroup = new THREE.Group();
  const canopyGeo = new THREE.ConeGeometry(2.7, 7.5, 7);
  const trunkGeo = new THREE.BoxGeometry(1.15, 4.2, 1.15);
  const canopyMat = new THREE.MeshLambertMaterial({ color: 0x3f7d38 });
  const trunkMat = new THREE.MeshLambertMaterial({ color: 0x6b4a2f });
  const canopy = new THREE.InstancedMesh(canopyGeo, canopyMat, Math.max(1, W.trees.length));
  const trunk = new THREE.InstancedMesh(trunkGeo, trunkMat, Math.max(1, W.trees.length));
  const PALETAS_ARBOL = {
    emberhold: [0x8a2b3a, 0x2b7a6a, 0xa9362f, 0x6a2b4a],
    frostveil: [0x2e6b45, 0x357a5a, 0x3f7d5a, 0x2a5a46],
    nightfall: [0x6a5a8a, 0x8a6a9a, 0x4a3a5a, 0x7a5a7a],
    evergrove: [0x2e6b45, 0x4b8b3a, 0x2f7a4a, 0x8a3a3a]
  };
  const treeColors = PALETAS_ARBOL[clave] || PALETAS_ARBOL.evergrove;
  W.trees.forEach((t, i) => {
    const x = t[0] + 0.5, y = t[1], z = t[2] + 0.5;
    dummy.position.set(x, y + 2.1, z);
    dummy.scale.set(1, 1, 1);
    dummy.rotation.set(0, 0, 0);
    dummy.updateMatrix();
    trunk.setMatrixAt(i, dummy.matrix);
    dummy.position.set(x, y + 7.2, z);
    dummy.updateMatrix();
    canopy.setMatrixAt(i, dummy.matrix);
    canopy.setColorAt(i, new THREE.Color(treeColors[t[3] % treeColors.length]));
  });
  canopy.count = trunk.count = W.trees.length;
  if (canopy.instanceColor) canopy.instanceColor.needsUpdate = true;
  treeGroup.add(trunk, canopy);
  scene.add(treeGroup);
  if (!W.trees.length) {
    document.getElementById('btnTrees').style.display = 'none';
  }

  const raycaster = new THREE.Raycaster();
  const pointer = new THREE.Vector2();
  const hoverEl = document.getElementById('hover');
  renderer.domElement.addEventListener('pointermove', (ev) => {
    const bloque = bloqueBajoPuntero(ev);
    if (!bloque) return;
    const h = alturaBloque(bloque.x, bloque.z);
    const mat = materialBloque(bloque.x, bloque.z);
    hoverEl.innerHTML = 'x <b>' + bloque.x + '</b> · z <b>' + bloque.z +
      '</b> · altura <b>' + h + '</b> · ' + mat +
      (bloque.exacto ? ' · <b>1:1</b>' : '');
  });

  const toast = document.getElementById('toast');
  let toastTimer = 0;
  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
  }

  const sel = document.getElementById('worldSel');
  chaves.forEach(function (k) {
    const op = document.createElement('option');
    op.value = k;
    op.textContent = dados[k].name;
    if (k === clave) op.selected = true;
    sel.appendChild(op);
  });
  sel.onchange = function () { location.search = '?world=' + sel.value; };
  if (chaves.length < 2) sel.style.display = 'none';

  const btnTextures = document.getElementById('btnTextures');
  const btnRelief = document.getElementById('btnRelief');
  const btnWater = document.getElementById('btnWater');
  const btnTrees = document.getElementById('btnTrees');
  const btnWire = document.getElementById('btnWire');
  let modo = 'texturas';
  function setModo(m) {
    modo = m;
    grupoBloques.visible = m === 'texturas';
    smooth.visible = m === 'relieve';
    grupoTiles.visible = fineActivo && m === 'texturas';
    btnTextures.classList.toggle('on', m === 'texturas');
    btnRelief.classList.toggle('on', m === 'relieve');
    showToast(m === 'texturas' ? 'Bloques con texturas'
      : 'Color por relieve');
  }
  const btnFine = document.getElementById('btnFine');
  if (!fine) {
    btnFine.style.display = 'none';
    fineActivo = false;
  } else {
    btnFine.onclick = () => {
      fineActivo = !fineActivo;
      btnFine.classList.toggle('on', fineActivo);
      grupoTiles.visible = fineActivo && modo === 'texturas';
      if (fineActivo) {
        firmaTiles = '';
        actualizarTiles(true);
        showToast('Detalle 1:1 activado');
      } else {
        showToast('Detalle 1:1 desactivado');
      }
    };
  }
  btnTextures.onclick = () => setModo('texturas');
  btnRelief.onclick = () => setModo('relieve');
  btnWater.onclick = () => {
    water.visible = !water.visible;
    btnWater.classList.toggle('on', water.visible);
  };
  btnTrees.onclick = () => {
    treeGroup.visible = !treeGroup.visible;
    btnTrees.classList.toggle('on', treeGroup.visible);
    if (!W.trees.length) showToast('Esta exportación no detectó árboles de tronco.');
  };
  btnWire.onclick = () => {
    const w = !smoothMat.wireframe;
    smoothMat.wireframe = w;
    material.wireframe = w;
    grupoBloques.children.forEach((mesh) => {
      mesh.material.wireframe = w;
      mesh.material.needsUpdate = true;
    });
    smoothMat.needsUpdate = true;
    material.needsUpdate = true;
    btnWire.classList.toggle('on', w);
  };
  document.getElementById('btnTop').onclick = () => {
    camera.position.set(0.1, area * 1.5, 0.1);
    controls.target.copy(center);
    controls.update();
  };
  document.getElementById('btnReset').onclick = () => {
    camera.position.set(area * 0.75, area * 0.55, area * 0.75);
    controls.target.copy(center);
    controls.update();
  };
  if (new URLSearchParams(location.search).get('top')) {
    camera.position.set(0.1, area * 1.5, 0.1);
    controls.target.copy(center);
    controls.update();
  }

  addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  const enlace = new URLSearchParams(location.search);
  if (enlace.get('x') !== null && enlace.get('z') !== null) {
    const px = parseInt(enlace.get('x'), 10);
    const pz = parseInt(enlace.get('z'), 10);
    if (!isNaN(px) && !isNaN(pz)) {
      const py = alturaBloque(px, pz);
      controls.target.set(px + 0.5, py, pz + 0.5);
      const d = Math.max(60, Math.min(400,
        parseFloat(enlace.get('d')) || 150));
      camera.position.set(px + 0.5 + d, py + d * 0.8, pz + 0.5 + d);
      controls.update();
      firmaTiles = '';
      actualizarTiles(true);
      seleccionar(px, pz);
    }
  }

  function animate() {
    requestAnimationFrame(animate);
    controls.update();
    actualizarTiles(false);
    if (seleccion && marcador.visible) {
      const v = new THREE.Vector3(seleccion.x + 0.5, seleccion.y + 2.2,
        seleccion.z + 0.5).project(camera);
      const detras = v.z > 1 || v.z < -1;
      pin.style.display = detras ? 'none' : 'block';
      if (!detras) {
        pin.style.left = ((v.x * 0.5 + 0.5) * innerWidth) + 'px';
        pin.style.top = ((-v.y * 0.5 + 0.5) * innerHeight) + 'px';
      }
    }
    renderer.render(scene, camera);
  }

  animate();
})();
</script>
</body>
</html>
